<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: transparent; overflow: hidden; }
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
body, * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

#canvas {
  position: relative;
  overflow: hidden;
}

.bg-blurred {
  position: absolute;
  inset: 0;
}
.bg-blurred img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: blur(40px) brightness(0.4) saturate(1.5);
  transform: scale(1.3);
}

.glow-container {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8%;
}

.cover-wrapper {
  position: relative;
}

.cover-glow {
  position: absolute;
  inset: 0;
  border-radius: 16px;
  background-size: cover;
  background-position: center;
  filter: blur(30px) brightness(0.8) saturate(2);
  transform: scale(1.3);
  opacity: 0.7;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes revealLTR {
  from { clip-path: inset(0 100% 0 0); }
  to { clip-path: inset(0 0 0 0); }
}

.cover-image {
  position: relative;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 16px;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
}

.player-widget {
  position: relative;
  border-radius: 16px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 3% 5%;
}

.player-artist {
  font-weight: 700;
  text-align: center;
  color: white;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
}

.player-track {
  text-align: center;
  color: white;
  opacity: 0.8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 100%;
}

.progress-bar {
  width: 100%;
  border-radius: 9999px;
  background: rgba(255,255,255,0.3);
  margin-top: 4px;
  overflow: hidden;
}

.progress-fill {
  border-radius: 9999px;
  background: white;
  height: 100%;
  width: 0%;
}

.player-controls {
  display: flex;
  align-items: center;
  gap: 8%;
  margin-top: 4px;
  color: white;
}
.player-controls span { opacity: 0.6; }
.player-controls .play-btn { opacity: 1; }

.promo-container {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
}

.promo-container.promo-landscape {
  flex-direction: row;
  align-items: center;
  justify-content: center;
  padding: 6%;
}

.promo-cover-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5%;
}

.promo-landscape .promo-cover-area {
  flex: none;
  padding: 0;
  position: relative;
}

.promo-cover-glow {
  position: absolute;
  inset: 0;
  border-radius: 16px;
  filter: blur(30px) brightness(0.7) saturate(2);
  transform: scale(1.25);
  opacity: 0.6;
  background-size: cover;
  background-position: center;
}

.promo-cover-image {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 12px;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
}

.promo-landscape .promo-cover-image {
  position: relative;
  object-fit: cover;
  border-radius: 16px;
}

.promo-text {
  padding: 0 6% 6%;
}

.promo-landscape .promo-text {
  padding: 0;
  padding-left: 5%;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.promo-tagline {
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 4px;
  opacity: 0.9;
}

.promo-title {
  font-weight: 700;
  line-height: 1.1;
}

.promo-stores {
  padding: 0 6% 5%;
  display: flex;
  align-items: center;
  gap: 3%;
}

.promo-landscape .promo-stores {
  padding: 0;
  padding-left: 5%;
  margin-top: 4%;
}

.store-icon {
  opacity: 0.8;
  display: inline-block;
}

.store-icon svg {
  fill: currentColor;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<div id="canvas"></div>
<script>

  youtube: '<svg viewBox="0 0 576 512"><path d="M549.655 124.083c-6.281-23.65-24.787-42.276-48.284-48.597C458.781 64 288 64 288 64S117.22 64 74.629 75.486c-23.497 6.322-42.003 24.947-48.284 48.597-11.412 42.867-11.412 132.305-11.412 132.305s0 89.438 11.412 132.305c6.281 23.65 24.787 41.5 48.284 47.821C117.22 448 288 448 288 448s170.78 0 213.371-11.486c23.497-6.321 42.003-24.171 48.284-47.821 11.412-42.867 11.412-132.305 11.412-132.305s0-89.438-11.412-132.305zm-317.51 213.508V175.185l142.739 81.205-142.739 81.201z"/></svg>',

  tidal: '<svg viewBox="0 0 512 512"><path d="M256 96l-96 96 96 96-96 96-96-96 96-96-96-96L256 0l96 96-96 96zm160-96l-96 96 96 96 96-96z"/></svg>',
  amazon: '<svg viewBox="0 0 448 512"><path d="M257.2 162.7c-48.7 1.8-169.5 15.5-169.5 117.5 0 109.5 138.3 114 183.5 43.2 6.5 10.2 35.4 37.5 45.3 46.8l56.8-56S341 288.9 341 261.4V114.3C341 89 316.5 32 228.7 32 140.7 32 94 87 94 136.3l73.5 6.8c16.3-49.5 54.2-49.5 54.2-49.5 40.7-.1 40.7 35.4 35.5 69.1zM257.2 245s-16.3 25-53 25c-30.5 0-30.5-25.3-30.5-29.3 0-30.5 16.3-46.1 53.2-49.7 36.8-3.6 30.5 0 30.5 0v54zm158 251.3c-13.5 3.2-5.3-3.6-5.3-3.6-54.5-42-74.6-64.3-79.6-74.1-49.5 63.8-159.6 97.8-229.4 50.3C-7 400.5 15.4 327.9 15.4 327.9c-1.8 3.6 0 7.3 0 7.3C71.2 445 170 391.4 208.7 375.6c34.3-17.7 49.3-22.2 84.3-59.4 7.3-7.3 12.1-14.5 12.1-14.5l.2.4c2.5 3.5 4.6 6.8 37.4 36.5 22.5 20.3 74 52 74 52z"/></svg>',
  shazam: '<svg viewBox="0 0 512 512"><path d="M256 8C119 8 8 119 8 256s111 248 248 248 248-111 248-248S393 8 256 8zm113.7 300.3c-32.9 32.9-86.8 32.9-119.7 0-11.4-11.4-19.7-25.4-24.4-40.8-1.7-5.6 1.4-11.5 7-13.2 5.6-1.7 11.5 1.4 13.2 7 3.5 11.5 9.7 21.9 18.2 30.4 24.6 24.6 64.5 24.6 89.1 0 24.6-24.6 24.6-64.5 0-89.1-24.6-24.6-64.5-24.6-89.1 0-7.8 7.8-13.5 17.2-17.1 27-1.7 4.7-6.9 7.2-11.6 5.5-4.7-1.7-7.2-6.9-5.5-11.6 4.7-12.8 12.1-24.9 22.2-35 32.9-32.9 86.8-32.9 119.7 0 32.9 32.9 32.9 86.8 0 119.7h0zm-39.9-129.8c-7.8-7.8-17.2-13.5-27-17.1-4.7-1.7-7.2-6.9-5.5-11.6 1.7-4.7 6.9-7.2 11.6-5.5 12.8 4.7 24.9 12.1 35 22.2 32.9 32.9 32.9 86.8 0 119.7-32.9 32.9-86.8 32.9-119.7 0-11.4-11.4-19.7-25.4-24.4-40.8-1.7-5.6 1.4-11.5 7-13.2 5.6-1.7 11.5 1.4 13.2 7 3.5 11.5 9.7 21.9 18.2 30.4 24.6 24.6 64.5 24.6 89.1 0 24.5-24.6 24.5-64.5-.5-89.1z"/></svg>'
};

const STORE_LABELS = {
  spotify: 'Spotify',
  apple: 'Apple Music',
  youtube: 'YouTube Music',
  tiktok: 'TikTok',
  deezer: 'Deezer',
  tidal: 'Tidal',
  amazon: 'Amazon Music',
  shazam: 'Shazam'
};

let _built = false;
let _refs = {};

function initLayout(config) {
  const { width, height, settings, artworkUrl, trackTitle, artistName } = config;
  const canvas = document.getElementById('canvas');
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  canvas.innerHTML = '';

  if (settings.backgroundType === 'video') {
    canvas.style.background = 'transparent';
  } else if (settings.backgroundType === 'solid') {
    canvas.style.background = settings.solidColor;
  } else if (settings.backgroundType === 'gradient') {
    canvas.style.background = 'linear-gradient(135deg, ' + settings.gradientColor1 + ', ' + settings.gradientColor2 + ')';
  } else {
    canvas.style.background = '#000';
  }

  _refs = {};

  if (settings.backgroundType === 'blurred' && artworkUrl) {
    const bgDiv = document.createElement('div');
    bgDiv.className = 'bg-blurred';
    const bgImg = document.createElement('img');
    bgImg.src = artworkUrl;
    bgDiv.appendChild(bgImg);
    canvas.appendChild(bgDiv);
  }

  const isLandscape = settings.format === 'landscape';
  const isSquare = settings.format === 'square';
  const isPortrait = settings.format === 'portrait';
  const isPromoLandscape = isLandscape && settings.template === 'promo-card';
  const isVideoBg = settings.backgroundType === 'video';

  var isVertical = settings.format === 'vertical';
  var coverSize;
  if (isPromoLandscape) { coverSize = Math.min(width, height) * 0.75; }
  else if (settings.template === 'promo-card') { coverSize = Math.min(width, height) * (isVertical ? 0.665 : 0.7); }
  else if (isVideoBg) {
    if (isLandscape) { coverSize = Math.min(width, height) * 0.55; }
    else if (isSquare) { coverSize = Math.min(width, height) * 0.38; }
    else if (isPortrait) { coverSize = Math.min(width, height) * 0.4; }
    else { coverSize = Math.min(width, height) * 0.45; }
  }
  else if (isLandscape) { coverSize = Math.min(width, height) * 0.65; }
  else { coverSize = Math.min(width, height) * 0.45; }

  if (settings.template === 'glow-player') {
    buildGlowPlayer(canvas, { width, height, artworkUrl, trackTitle, artistName, coverSize, settings });
  } else if (settings.template === 'promo-card' && (settings.promoLayout === 'fullscreen' || settings.promoLayout === 'textonly')) {
    buildPromoFullscreen(canvas, { width, height, artworkUrl: settings.promoLayout === 'textonly' ? null : artworkUrl, trackTitle, coverSize, settings });
  } else {
    buildPromoCard(canvas, { width, height, artworkUrl, trackTitle, artistName, coverSize, settings });
  }

  _built = true;
}

function buildGlowPlayer(canvas, opts) {
  const { width, height, artworkUrl, artistName, trackTitle, coverSize, settings } = opts;
  const isLandscape = settings.format === 'landscape';
  const isSquare = settings.format === 'square';
  const isPortrait = settings.format === 'portrait';
  const isVideoBg = settings.backgroundType === 'video';

  const container = document.createElement('div');
  container.className = 'glow-container';
  _refs.contentContainer = container;

  const mainRow = document.createElement('div');
  mainRow.style.display = 'flex';
  mainRow.style.alignItems = 'center';
  mainRow.style.justifyContent = 'center';
  mainRow.style.width = '100%';
  if (isLandscape) {
    mainRow.style.flexDirection = 'row';
    mainRow.style.gap = '5%';
    mainRow.style.paddingLeft = '8%';
    mainRow.style.paddingRight = '8%';
  } else {
    mainRow.style.flexDirection = 'column';
    mainRow.style.gap = '8%';
  }

  if (artworkUrl) {
    const coverWrapper = document.createElement('div');
    coverWrapper.className = 'cover-wrapper';
    coverWrapper.style.width = coverSize + 'px';
    coverWrapper.style.height = coverSize + 'px';
    _refs.coverWrapper = coverWrapper;

    if (settings.backgroundType !== 'video') {
      const glow = document.createElement('div');
      glow.className = 'cover-glow';
      glow.style.backgroundImage = 'url(' + artworkUrl + ')';
      _refs.glow = glow;
      coverWrapper.appendChild(glow);
    }

    const img = document.createElement('img');
    img.className = 'cover-image';
    img.src = artworkUrl;
    _refs.coverImg = img;
    coverWrapper.appendChild(img);

    mainRow.appendChild(coverWrapper);
  }

  const widget = document.createElement('div');
  widget.className = 'player-widget';
  widget.style.width = isLandscape ? (coverSize * 1.1) + 'px' : ((isVideoBg && isSquare) ? (coverSize * 0.85) + 'px' : (coverSize * 0.9) + 'px');
  widget.style.gap = (height * 0.01) + 'px';
  if (isLandscape) {
    widget.style.alignItems = 'flex-start';
  }

  const artist = document.createElement('p');
  artist.className = 'player-artist';
  artist.style.fontSize = Math.max(14, width * (isVideoBg && (isSquare || isPortrait) ? 0.03 : 0.035)) + 'px';
  if (isLandscape) artist.style.textAlign = 'left';
  artist.textContent = artistName;
  widget.appendChild(artist);

  const track = document.createElement('p');
  track.className = 'player-track';
  track.style.fontSize = Math.max(12, width * (isVideoBg && (isSquare || isPortrait) ? 0.024 : 0.028)) + 'px';
  if (isLandscape) track.style.textAlign = 'left';
  track.textContent = trackTitle;
  widget.appendChild(track);

  const bar = document.createElement('div');
  bar.className = 'progress-bar';
  bar.style.height = Math.max(3, height * 0.004) + 'px';
  const fill = document.createElement('div');
  fill.className = 'progress-fill';
  _refs.progressFill = fill;
  bar.appendChild(fill);
  widget.appendChild(bar);

  const controls = document.createElement('div');
  controls.className = 'player-controls';
  controls.style.justifyContent = 'center';
  controls.style.width = '100%';
  controls.style.gap = '10%';
  const iconSz = Math.max(12, width * 0.04);
  controls.innerHTML = ''
    + '<svg width="' + (iconSz*0.7) + '" height="' + (iconSz*0.7) + '" viewBox="0 0 24 24" fill="white" opacity="0.5"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" transform="scale(-1,1) translate(-24,0)"/></svg>'
    + '<svg width="' + (iconSz*0.6) + '" height="' + (iconSz*0.6) + '" viewBox="0 0 24 24" fill="white" opacity="0.5"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>'
    + '<svg width="' + iconSz + '" height="' + iconSz + '" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>'
    + '<svg width="' + (iconSz*0.6) + '" height="' + (iconSz*0.6) + '" viewBox="0 0 24 24" fill="white" opacity="0.5"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>'
    + '<svg width="' + (iconSz*0.7) + '" height="' + (iconSz*0.7) + '" viewBox="0 0 24 24" fill="white" opacity="0.5"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>';
  widget.appendChild(controls);

  mainRow.appendChild(widget);
  container.appendChild(mainRow);

  if (isVideoBg) {
    mainRow.style.opacity = '0';
    mainRow.style.animation = 'fadeIn 0.8s ease-out forwards';
    if (isSquare) { mainRow.style.gap = '4%'; }
    else if (isPortrait) { mainRow.style.gap = '5%'; }
    if (isSquare || isPortrait || isLandscape) {
      mainRow.style.marginTop = (-height * 0.08) + 'px';
    }
  } else if (!isLandscape) {
    mainRow.style.marginTop = (-height * 0.05) + 'px';
  }

  var storeCount = 0;
  var isVertical = !isSquare && !isPortrait && !isLandscape;

  function buildStoresDiv(storeGap, storeMarginTop, animated) {
    const storesDiv = document.createElement('div');
    storesDiv.style.display = 'flex';
    storesDiv.style.alignItems = 'center';
    storesDiv.style.justifyContent = 'center';
    storesDiv.style.flexWrap = 'wrap';
    storesDiv.style.gap = storeGap + 'px';
    if (storeMarginTop) storesDiv.style.marginTop = storeMarginTop + 'px';
    const storeIconSize = Math.max(16, width * 0.035);
    const storeFontSize = Math.max(10, width * 0.025);
    settings.storeIcons.forEach(function(iconId, idx) {
      if (STORE_SVGS[iconId]) {
        storeCount++;
        const item = document.createElement('span');
        item.style.display = 'flex';
        item.style.alignItems = 'center';
        item.style.gap = (width * 0.01) + 'px';
        if (animated) {
          item.style.opacity = '0';
          item.style.animation = 'fadeIn 0.5s ease-out forwards';
          item.style.animationDelay = (1.0 + idx * 0.3) + 's';
        } else {
          item.style.opacity = '0.9';
        }
        const iconSpan = document.createElement('span');
        iconSpan.style.display = 'inline-block';
        iconSpan.style.width = storeIconSize + 'px';
        iconSpan.style.height = storeIconSize + 'px';
        iconSpan.style.color = settings.storeIconStyle || 'white';
        iconSpan.innerHTML = STORE_SVGS[iconId];
        iconSpan.querySelector('svg').style.fill = 'currentColor';
        iconSpan.querySelector('svg').style.width = '100%';
        iconSpan.querySelector('svg').style.height = '100%';
        item.appendChild(iconSpan);
        var labelSpan = document.createElement('span');
        labelSpan.style.color = settings.storeIconStyle || 'white';
        labelSpan.style.fontSize = storeFontSize + 'px';
        labelSpan.style.fontWeight = '600';
        labelSpan.style.letterSpacing = '0.02em';
        labelSpan.textContent = STORE_LABELS[iconId] || iconId;
        item.appendChild(labelSpan);
        storesDiv.appendChild(item);
      }
    });
    return storesDiv;
  }

  function buildWatermark(marginTop, marginBottom, noItalic) {
    var watermarkDelay = 1.0 + storeCount * 0.3 + 0.3;
    var wm = document.createElement('p');
    wm.style.color = settings.storeIconStyle || 'white';
    wm.style.opacity = '0.5';
    wm.style.fontSize = Math.max(8, width * 0.018) + 'px';
    wm.style.fontWeight = '400';
    if (!noItalic) wm.style.fontStyle = 'italic';
    wm.style.textAlign = 'center';
    wm.style.marginTop = marginTop + 'px';
    if (marginBottom) wm.style.marginBottom = marginBottom + 'px';
    wm.style.letterSpacing = '0.03em';
    wm.textContent = 'Distributed by muzika.ua';
    wm.style.clipPath = 'inset(0 100% 0 0)';
    wm.style.animation = 'revealLTR 0.8s ease-out forwards';
    wm.style.animationDelay = watermarkDelay + 's';
    return wm;
  }

  if (isVideoBg && isVertical) {
    if (settings.storeIcons && settings.storeIcons.length > 0) {
      container.appendChild(buildStoresDiv(width * 0.05, height * 0.1, true));
    }
    container.appendChild(buildWatermark(height * 0.12, 0));
  } else if (isVideoBg && (isSquare || isPortrait || isLandscape)) {
    var bottomGroup = document.createElement('div');
    bottomGroup.style.position = 'absolute';
    bottomGroup.style.left = '0';
    bottomGroup.style.right = '0';
    bottomGroup.style.bottom = (height * 0.04) + 'px';
    bottomGroup.style.display = 'flex';
    bottomGroup.style.flexDirection = 'column';
    bottomGroup.style.alignItems = 'center';
    var wmEl = buildWatermark(0, height * 0.015, true);
    bottomGroup.appendChild(wmEl);
    if (settings.storeIcons && settings.storeIcons.length > 0) {
      bottomGroup.appendChild(buildStoresDiv(width * (isLandscape ? 0.04 : 0.05), 0, true));
    }
    container.appendChild(bottomGroup);
  } else if (!isVideoBg && settings.storeIcons && settings.storeIcons.length > 0) {
    container.appendChild(buildStoresDiv(width * 0.05, height * 0.1, false));
  }

  canvas.appendChild(container);
}

function applyVerticalPosition(el, position, height, padding) {
  el.style.position = 'absolute';
  el.style.left = '0';
  el.style.right = '0';
  if (position === 'top') {
    el.style.top = (height * padding) + 'px';
  } else if (position === 'center') {
    el.style.top = '50%';
    el.style.transform = 'translateY(-50%)';
  } else {
    el.style.bottom = (height * padding) + 'px';
  }
}

function getTextShadowCSS(color, intensity, glow, glowColor) {
  var parts = [];
  if (intensity > 0) {
    var blur = Math.round(intensity * 0.4);
    var spread = Math.round(intensity * 0.2);
    parts.push('0 2px ' + blur + 'px ' + color);
    if (spread > 5) parts.push('0 0 ' + spread + 'px ' + color);
  }
  if (glow) {
    parts.push('0 0 20px ' + glowColor, '0 0 40px ' + glowColor, '0 0 60px ' + glowColor + '40');
  }
  return parts.length > 0 ? parts.join(', ') : 'none';
}

function getIconFilterCSS(color, intensity, glow, glowColor) {
  var parts = [];
  if (intensity > 0) {
    var blur = Math.round(intensity * 0.3);
    parts.push('drop-shadow(0 2px ' + blur + 'px ' + color + ')');
  }
  if (glow) {
    parts.push('drop-shadow(0 0 8px ' + glowColor + ')', 'drop-shadow(0 0 16px ' + glowColor + ')');
  }
  return parts.length > 0 ? parts.join(' ') : 'none';
}

function buildPromoFullscreen(canvas, opts) {
  const { width, height, artworkUrl, trackTitle, coverSize, settings } = opts;

    if (settings.promoTitleColor !== 'none') {

      title.style.lineHeight = '1.1';
      title.style.fontSize = Math.max(20, width * 0.045) + 'px';
      title.style.color = settings.promoTitleColor;
      title.style.textShadow = textShadow;
      title.style.marginBottom = (height * 0.03) + 'px';
      title.style.whiteSpace = 'nowrap';
      title.style.overflow = 'hidden';

    container.appendChild(textDiv);

    if (settings.storeIcons && settings.storeIcons.length > 0) {
      var storesDiv = document.createElement('div');
      storesDiv.style.display = 'grid';
      storesDiv.style.gridTemplateColumns = 'repeat(' + Math.min(3, settings.storeIcons.length) + ', auto)';
      storesDiv.style.gap = (height * 0.015) + 'px ' + (width * 0.015) + 'px';
      storesDiv.style.justifyContent = 'start';
      storesDiv.style.alignItems = 'center';
      storesDiv.style.position = 'absolute';
      storesDiv.style.left = artworkUrl ? '50%' : '6%';
      storesDiv.style.filter = iconFilter;
      if (iconsPos === 'top') { storesDiv.style.top = textPos === 'top' ? '18%' : '6%'; }
      else if (iconsPos === 'center') {
        storesDiv.style.top = '50%';
        storesDiv.style.transform = textPos === 'center' ? 'translateY(60%)' : 'translateY(-50%)';
      }
      else { storesDiv.style.bottom = '6%'; }

      var iconSize = Math.max(14, width * 0.025);
      settings.storeIcons.forEach(function(iconId) {
        if (STORE_SVGS[iconId]) {
          var item = document.createElement('div');
          item.style.display = 'flex';
          item.style.alignItems = 'center';
          item.style.whiteSpace = 'nowrap';
          item.style.gap = (width * 0.008) + 'px';

          var span = document.createElement('span');
          span.className = 'store-icon';
          span.style.color = settings.storeIconStyle || 'white';
          span.style.width = iconSize + 'px';
          span.style.height = iconSize + 'px';
          span.innerHTML = STORE_SVGS[iconId];
          item.appendChild(span);

          var label = document.createElement('span');
          label.style.color = settings.storeIconStyle || 'white';
          label.style.fontSize = Math.max(10, width * 0.015) + 'px';
          label.style.fontWeight = '600';
          label.style.letterSpacing = '0.02em';
          label.textContent = STORE_LABELS[iconId] || iconId;
          item.appendChild(label);

          storesDiv.appendChild(item);

      container.appendChild(storesDiv);

  } else {

      var coverWrap = document.createElement('div');

      coverWrap.style.left = '0';
      coverWrap.style.right = '0';
      coverWrap.style.display = 'flex';
      coverWrap.style.alignItems = 'center';
      coverWrap.style.justifyContent = 'center';
      coverWrap.style.top = '50%';
      coverWrap.style.transform = 'translateY(-60%)';

      var coverImg2 = document.createElement('img');
      coverImg2.src = artworkUrl;
      coverImg2.style.width = (coverSize * 0.85) + 'px';
      coverImg2.style.height = (coverSize * 0.85) + 'px';
      coverImg2.style.objectFit = 'cover';
      coverImg2.style.borderRadius = '16px';
      coverImg2.style.boxShadow = '0 25px 50px -12px rgba(0,0,0,0.5)';
      coverWrap.appendChild(coverImg2);
      container.appendChild(coverWrap);
      _refs.promoCoverImg = coverImg2;
    }

    var textDiv2 = document.createElement('div');
    textDiv2.style.width = '100%';
    textDiv2.style.textAlign = 'center';
    textDiv2.style.position = 'absolute';
    textDiv2.style.left = '0';
    textDiv2.style.right = '0';
    if (textPos === 'top') {
      textDiv2.style.top = (iconsPos === 'top' ? height * 0.02 : height * 0.06) + 'px';
    } else if (textPos === 'center') {
      textDiv2.style.top = '50%';
      textDiv2.style.transform = iconsPos === 'center' ? 'translateY(-120%)' : 'translateY(-50%)';
    } else {
      textDiv2.style.bottom = (iconsPos === 'bottom' ? height * 0.18 : height * 0.06) + 'px';
    }

    if (settings.taglineColor !== 'none') {
      var tagline2 = document.createElement('p');
      tagline2.style.fontWeight = '600';
      tagline2.style.textTransform = 'uppercase';
      tagline2.style.letterSpacing = '0.08em';
      tagline2.style.fontSize = Math.max(14, width * 0.022) + 'px';
      tagline2.style.color = settings.taglineColor;
      tagline2.style.opacity = '0.85';
      tagline2.style.marginBottom = (height * 0.01) + 'px';
      tagline2.style.textShadow = textShadow;
      tagline2.textContent = taglineText;
      textDiv2.appendChild(tagline2);

    if (settings.promoTitleColor !== 'none') {
      var title2 = document.createElement('p');
      title2.style.fontWeight = '900';
      title2.style.lineHeight = '0.95';
      title2.style.fontSize = Math.max(28, width * 0.1) + 'px';
      title2.style.color = settings.promoTitleColor;
      title2.style.textShadow = textShadow;
      title2.style.letterSpacing = '-0.02em';
      title2.textContent = titleText;
      textDiv2.appendChild(title2);
    }

    container.appendChild(textDiv2);

    if (settings.storeIcons && settings.storeIcons.length > 0) {
      var storesDiv2 = document.createElement('div');
      storesDiv2.style.width = '100%';
      storesDiv2.style.display = 'flex';
      storesDiv2.style.alignItems = 'center';
      storesDiv2.style.justifyContent = 'center';
      storesDiv2.style.flexWrap = 'wrap';
      storesDiv2.style.gap = (width * 0.05) + 'px';
      storesDiv2.style.position = 'absolute';
      storesDiv2.style.left = '0';
      storesDiv2.style.right = '0';
      storesDiv2.style.filter = iconFilter;
      if (iconsPos === 'top') {
        storesDiv2.style.top = (textPos === 'top' ? height * 0.18 : height * 0.05) + 'px';
      } else if (iconsPos === 'center') {
        storesDiv2.style.top = '50%';
        storesDiv2.style.transform = textPos === 'center' ? 'translateY(60%)' : 'translateY(-50%)';
      } else {
        storesDiv2.style.bottom = (height * 0.05) + 'px';
      }

      var iconSize2 = Math.max(16, width * 0.035);
      settings.storeIcons.forEach(function(iconId) {
        if (STORE_SVGS[iconId]) {
          var item = document.createElement('div');
          item.style.display = 'flex';
          item.style.alignItems = 'center';
          item.style.gap = (width * 0.012) + 'px';

          var span = document.createElement('span');
          span.className = 'store-icon';
          span.style.color = settings.storeIconStyle || 'white';
          span.style.width = iconSize2 + 'px';
          span.style.height = iconSize2 + 'px';
          span.innerHTML = STORE_SVGS[iconId];
          item.appendChild(span);

          var label = document.createElement('span');
          label.style.color = settings.storeIconStyle || 'white';
          label.style.fontSize = Math.max(12, width * 0.022) + 'px';
          label.style.fontWeight = '600';
          label.style.letterSpacing = '0.02em';

          storesDiv2.appendChild(item);
        }

      container.appendChild(storesDiv2);

  canvas.appendChild(container);

function buildPromoCard(canvas, opts) {
  const { width, height, artworkUrl, trackTitle, coverSize, settings } = opts;
  const titleText = settings.promoTitle || trackTitle;
  const taglineText = settings.tagline || 'NEW MUSIC';
  const isLandscape = settings.format === 'landscape';
  var textShadow = getTextShadowCSS(settings.textShadowColor || '#000000', settings.textShadowIntensity || 0, settings.textGlow || false, settings.textGlowColor || '#ffffff');
  var iconFilter = getIconFilterCSS(settings.iconShadowColor || '#000000', settings.iconShadowIntensity || 0, settings.iconGlow || false, settings.iconGlowColor || '#ffffff');

  const container = document.createElement('div');
  container.className = 'promo-container' + (isLandscape ? ' promo-landscape' : '');
  _refs.contentContainer = container;

  const coverArea = document.createElement('div');
  coverArea.className = 'promo-cover-area';

  if (artworkUrl) {
    const img = document.createElement('img');
    img.className = 'promo-cover-image';
    img.src = artworkUrl;
    img.style.width = (isLandscape ? coverSize * 0.75 : coverSize) + 'px';
    img.style.height = (isLandscape ? coverSize * 0.75 : coverSize) + 'px';
    _refs.promoCoverImg = img;
    coverArea.appendChild(img);
  }
  container.appendChild(coverArea);

  if (isLandscape) {
    const rightSide = document.createElement('div');
    rightSide.className = 'promo-text';

    if (settings.taglineColor !== 'none') {
      const tagline = document.createElement('p');
      tagline.className = 'promo-tagline';
      tagline.style.fontSize = Math.max(14, width * 0.022) + 'px';
      tagline.style.color = settings.taglineColor;
      tagline.style.opacity = '0.85';
      tagline.style.marginBottom = (height * 0.02) + 'px';
      tagline.style.textShadow = textShadow;
      tagline.textContent = taglineText;
      rightSide.appendChild(tagline);
    }

    if (settings.promoTitleColor !== 'none') {
      const title = document.createElement('p');
      title.className = 'promo-title';
      title.style.fontSize = Math.max(20, width * 0.055) + 'px';
      title.style.color = settings.promoTitleColor;
      title.style.marginBottom = (height * 0.04) + 'px';
      title.style.textShadow = textShadow;
      title.textContent = titleText;
      rightSide.appendChild(title);
    }

    if (settings.storeIcons && settings.storeIcons.length > 0) {
      const storesDiv = document.createElement('div');
      storesDiv.className = 'promo-stores';
      storesDiv.style.display = 'flex';
      storesDiv.style.alignItems = 'center';
      storesDiv.style.gap = (width * 0.02) + 'px';
      storesDiv.style.filter = iconFilter;
      const iconSize = Math.max(20, width * 0.035);
      settings.storeIcons.forEach(function(iconId) {
        if (STORE_SVGS[iconId]) {
          const span = document.createElement('span');
          span.className = 'store-icon';
          span.style.color = settings.storeIconStyle || 'white';
          span.style.width = iconSize + 'px';
          span.style.height = iconSize + 'px';
          span.innerHTML = STORE_SVGS[iconId];
          storesDiv.appendChild(span);
        }
      });
      rightSide.appendChild(storesDiv);
    }

    container.appendChild(rightSide);
  } else {
    var isVerticalPromo = settings.format === 'vertical';

    if (isVerticalPromo) {
      container.style.alignItems = 'center';
      container.style.justifyContent = 'center';
      coverArea.style.flex = 'none';
    }

    const textDiv = document.createElement('div');
    textDiv.className = 'promo-text';
    if (isVerticalPromo) {
      textDiv.style.textAlign = 'center';
      textDiv.style.padding = '2% 5%';
    }

    if (settings.taglineColor !== 'none') {
      const tagline = document.createElement('p');
      tagline.className = 'promo-tagline';
      tagline.style.fontSize = Math.max(12, width * 0.025) + 'px';
      tagline.style.color = settings.taglineColor;
      tagline.style.textShadow = textShadow;
      tagline.textContent = taglineText;
      textDiv.appendChild(tagline);
    }

    if (settings.promoTitleColor !== 'none') {
      const title = document.createElement('p');
      title.className = 'promo-title';
      title.style.fontSize = Math.max(16, width * 0.06) + 'px';
      title.style.color = settings.promoTitleColor;
      title.style.textShadow = textShadow;
      title.textContent = titleText;
      textDiv.appendChild(title);
    }

    container.appendChild(textDiv);

    if (settings.storeIcons && settings.storeIcons.length > 0) {
      const storesDiv = document.createElement('div');
      storesDiv.className = 'promo-stores';
      storesDiv.style.filter = iconFilter;
      if (isVerticalPromo) {
        storesDiv.style.justifyContent = 'center';
        storesDiv.style.padding = '0 5% 2%';
      }
      const iconSize = Math.max(16, width * 0.04);
      settings.storeIcons.forEach(function(iconId) {
        if (STORE_SVGS[iconId]) {
          const span = document.createElement('span');
          span.className = 'store-icon';
          span.style.color = settings.storeIconStyle || 'white';
          span.style.width = iconSize + 'px';
          span.style.height = iconSize + 'px';
          span.innerHTML = STORE_SVGS[iconId];
          storesDiv.appendChild(span);
        }
      });
      container.appendChild(storesDiv);
    }
  }

  canvas.appendChild(container);
}

function updateFrame(progress, duration) {
  var totalDur = duration || 30;
  var elapsed = progress * totalDur;
  var zoomT = Math.min(1, elapsed / 1.0);
  var zoomScale = 0.85 + 0.15 * zoomT;
  var zoomOpacity = 0.6 + 0.4 * zoomT;

  if (_refs.contentContainer) {
    _refs.contentContainer.style.transform = 'scale(' + zoomScale + ')';
    _refs.contentContainer.style.opacity = zoomOpacity;
  }

  if (_refs.coverImg) {
    var floatOffset = Math.sin(progress * Math.PI * 2) * 8;
    _refs.coverImg.style.transform = 'translateY(' + (-floatOffset) + 'px)';
  }
  if (_refs.glow) {
    _refs.glow.style.transform = 'scale(1.3)';
  }
  if (_refs.progressFill) {
    _refs.progressFill.style.width = (progress * 100) + '%';
  }
  if (_refs.promoCoverImg) {
    var scaleAnim = 0.95 + 0.05 * Math.min(1, progress * 3);
    _refs.promoCoverImg.style.transform = 'scale(' + scaleAnim + ')';
  }
}

window.initLayout = initLayout;
window.updateFrame = updateFrame;
window.__ready = true;
</script>
